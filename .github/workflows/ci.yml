name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            functions/package-lock.json

      # Os emuladores do Firebase precisam de Java
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: |
          npm ci
          npm ci --prefix web
          npm ci --prefix functions
          npm install -g firebase-tools@15

      - name: Testes unitários (app e functions)
        run: |
          npm --prefix web test
          npm --prefix functions test

      - name: Verificação de tipos e build
        run: |
          npm --prefix functions run build
          npm --prefix web run typecheck
          VITE_FIREBASE_API_KEY=ci VITE_FIREBASE_PROJECT_ID=demo-rolim npm --prefix web run build

      - name: Testes das regras de segurança
        run: npm run test:rules

      - name: Testes de ponta a ponta (PWA)
        run: |
          npx --prefix web playwright install --with-deps chromium
          npm run test:e2e
        env:
          CI: "true"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results
          retention-days: 7
